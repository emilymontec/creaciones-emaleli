allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# pnpm 11 activa por defecto "minimumReleaseAge: 1440" (los paquetes deben
# tener al menos 1 día publicados). Para verificarlo, pnpm consulta el
# metadata completo de CADA paquete del lockfile (600+ requests a
# registry.npmjs.org). En redes lentas/inestables esto es lo que hace que
# el "pnpm install" se quede colgado en "Verifying lockfile against
# supply-chain policies...". Lo desactivamos para desarrollo local; en CI
# puedes volver a activarlo (ver docs/environment.md).
minimumReleaseAge: 0
